provider: alibabacloud

providerConfigs:
  alibabacloud:
    # CA certificate file for custom TLS (e.g. /etc/certificates/ca.crt)
    # (default: "")
    # CACERT_FILE: ""

    # Client certificate file for custom TLS (e.g. /etc/certificates/client.crt)
    # (default: "")
    # CERT_FILE: ""

    # Client key file for custom TLS (e.g. /etc/certificates/client.key)
    # (default: "")
    # CERT_KEY: ""

    # Enable cloud config verify - should use it for production
    # (default: "false")
    # CLOUD_CONFIG_VERIFY: "false"

    # Use non-CVMs for peer pods
    # (default: "false")
    # DISABLECVM: "false"
    # true: skip SecurityOptions.ConfidentialComputingMode=TDX (Intel TDX only);
    # required for Hygon CSV instance families (ecs.g8h-csv-*) whose confidential
    # capability comes from the family itself, not the TDX API flag
    DISABLECVM: "true"

    # Confidential computing mode passed to SecurityOptions.ConfidentialComputingMode.
    # Must match what the ECS console sends for CSV confidential VMs ("CSV" on Hygon);
    # when set, it overrides DISABLECVM. When empty: DISABLECVM=false -> TDX, true -> none.
    CONFIDENTIAL_COMPUTING_MODE: "CSV"

    # Enable encrypted scratch space for pod VMs
    # (default: "false")
    # ENABLE_SCRATCH_SPACE: "false"

    # [EXPERIMENTAL] Enable external networking via pod VM
    # (default: "false")
    # EXTERNAL_NETWORK_VIA_PODVM: "false"

    # port number of agent protocol forwarder
    # (default: "")
    # FORWARDER_PORT: ""

    # Pod VM image id
    # (required)
    IMAGEID: "m-7ng00w62s46354u8s5eq"

    # Default initdata for all Pods
    # (default: "")
    # INITDATA: ""

    # Peer pod user-data format: cloud-config (write_files) or script (bash).
    # private cloud delivers user-data as a script; use script here.
    USER_DATA_FORMAT: "script"

    # SSH Keypair name to be used with the Pod VM
    # (default: "")
    # KEYNAME: ""

    # Login password (for root) to be used with the Pod VM, enabling VNC/SSH
    # access for guest debugging. Ignored when KEYNAME is set. Stored in plain
    # text in the peer-pods-cm ConfigMap - only set while debugging.
    # (default: "")
    # PASSWORD: ""

    # pause image to be used for the pods
    # (default: "")
    # PAUSE_IMAGE: ""

    # peer pods limit per node (default=10)
    # (default: "10")
    # PEERPODS_LIMIT_PER_NODE: "10"

    # base directory for pod directories
    # (default: "")
    # PODS_DIR: ""

    # Pod VM instance type
    # (default: "ecs.g8i.xlarge")
    # PODVM_INSTANCE_TYPE: "ecs.g8i.xlarge"
    PODVM_INSTANCE_TYPE: "ecs.g8h-csv-2numa-hg-k10-c1m1.large"

    # System disk category for the Pod VMs; must be available in the target zone
    # (default: "cloud_essd"; private cloud zones without ESSD can use cloud_ssd / cloud_efficiency)
    SYSTEM_DISK_CATEGORY: "cloud_pperf"

    # Timeout (seconds) to wait for the Pod VM to reach Running status before
    # connecting to the agent forwarder on port 15150. Custom CSV images can
    # take several minutes on first boot; transient ECS API errors during the
    # wait are retried instead of aborting.
    # (default: 180)
    INSTANCE_READY_TIMEOUT: "600"

    # Retry window for establishing the agent proxy connection to the pod VM
    # forwarder (port 15150), in Go duration format. On expiry the VM is
    # cleaned up immediately (unless KEEP_INSTANCE_ON_FAILURE is set).
    # (default: "5m")
    PROXY_TIMEOUT: "5m"

    # Preserve the pod VM instance instead of deleting it when VM startup
    # fails (e.g. shim/kubelet cancels the start call) - for debugging only.
    # Kept VMs hold CSV stock and must be deleted manually.
    # (default: "false")
    # KEEP_INSTANCE_ON_FAILURE: "false"

    # [EXPERIMENTAL] Comma separated CIDRs for local pod subnets
    # (default: "")
    # POD_SUBNET_CIDRS: ""

    # Maximum timeout in minutes for establishing agent proxy connection
    # (default: "")
    # PROXY_TIMEOUT: ""

    # Region
    # (default: "cn-beijing")
    REGION: "cn-wulan-env213-d01"

    # ECS API endpoint override for private cloud, used as-is by the SDK
    # (skips the default regional resolution which builds ecs.<region>.aliyuncs.com)
    # ECS_ENDPOINT: "ecs.cn-wulan-env213-d01.aliyuncs.com"
    ECS_ENDPOINT: "ecs-internal.inter.env213.shuguang.com"

    # VPC API endpoint override for private cloud, used as-is by the SDK
    # (skips the default regional resolution which builds vpc.<region>.aliyuncs.com)
    # VPC_ENDPOINT: "vpc.cn-wulan-env213-d01.aliyuncs.com"
    VPC_ENDPOINT: "vpc-internal.inter.env213.shuguang.com"

    # Skip TLS certificate verification for ECS/VPC API endpoints
    # (private cloud endpoints with self-signed / SAN-less certs)
    IGNORE_SSL: "true"

    # STS endpoint for RRSA AssumeRoleWithOIDC in private cloud;
    # when set, the adaptor calls it directly instead of resolving sts.aliyuncs.com
    # (adjust the domain if your environment uses a different STS gateway)
    STS_ENDPOINT: "sts-vpc.inter.env213.shuguang.com"

    # Unix domain socket path of remote hypervisor service
    # (default: "")
    # REMOTE_HYPERVISOR_ENDPOINT: ""

    # Security Group Ids to be used for the Pod VM, comma separated
    # (default: "cn-beijing")
    # SECURITY_GROUP_IDS: "cn-beijing"
    SECURITY_GROUP_IDS: "sg-7ng01x2wjskl2ht9pu8f"

    # System Disk size (in GiB) for the Pod VMs
    # (default: "40")
    # SYSTEM_DISK_SIZE: "40"

    # Custom tags (key=value pairs) to be used for the Pod VMs, comma separated
    # (default: "")
    # TAGS: ""

    # Comma-separated IANA TLS cipher suite names for peer pod connections (not applicable for VersionTLS13)
    # (default: "")
    # TLS_CIPHER_SUITES: ""

    # Minimum TLS version for peer pod connections (VersionTLS12 or VersionTLS13)
    # (default: "")
    # TLS_MIN_VERSION: ""

    # Skip TLS certificate verification - use it only for testing
    # (default: "false")
    # TLS_SKIP_VERIFY: "false"

    # Tunnel provider
    # (default: "")
    # TUNNEL_TYPE: ""

    # Use Public IP for connecting to the kata-agent inside the Pod VM
    # (default: "false")
    # USE_PUBLIC_IP: "false"

    # vSwitch ID to be used for the Pod VMs
    # (required)
    VSWITCH_ID: "vsw-7ng2zz4qlz50srfniwom2"

    # VXLAN UDP port number (VXLAN tunnel mode only
    # (default: "")
    # VXLAN_PORT: ""

